<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0"> <!--device screen-->

        <title>LOVE CALCULATOR</title>

        <style>
            h1{color:rgb(150, 19, 84);
                font-size:40px}
            body{
                background-color:rgb(242, 212, 217);
                font-family:Verdana;
                font-weight:bold;
                text-align:center;
                margin:0;
                min-height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;}
            input{
                width:80%;
                max-width:300px;
                border:1px solid rgb(60,60,60);
                border-radius:8px;
                margin:10px auto;
                background-color:rgb(243,192,208);
                padding:10px;}
            button{
                width:80%;
                max-width:300px;
                padding:15px;
                font-size:24px;
                border:none;
                border-radius:15px;
                background-color:rgb(247,150,182);
                cursor:pointer;}
            button:hover{
                background-color:rgb(222, 74, 165);
                transform:scale(1.3);
                transition:0.3s}
            #result{
                margin-top:20px;
                font-size:20px;
                color:rgb(227, 43, 43);}
            .container{
                width:90%;
                max-width:600px;
                padding:40px 20px;
                background-color:rgb(246,220,227);
                border-radius:20px;
                border:2px solid rgb(150,19,84);
                box-shadow:0px 5px 15px rgba(0,0,0,0.2);}
            .p1{font-style: italic;
                font-family: Arial, Helvetica, sans-serif;
                font-size: smaller;
                font-weight: lighter;
                color:black}
                

        </style>
    </head>
    <body>
        <div class=" container">
            <h1>❤ LOVE CALCULATOR ❤</h1>
            <input type="text" id="name1" placeholder="Your name">
            <br>
            <input type="text" id="name2" placeholder="Your crush's name">
            <br>
            <button onclick="calculate()">Check if its true!!!</button>
            <p id="result"></p>
            
        </div>
        <script>
           function calculate() {
                const name1 = document.getElementById("name1").value.trim().toLowerCase(); //trim-spaces
                const name2 = document.getElementById("name2").value.trim().toLowerCase();


                if (name1 === "" || name2 === "") {
                    document.getElementById("result").innerHTML = "*Please enter both names*";
                    return;
                }
                
                const combinedNames= name1+name2;
                let truecount=0;
                let lovecount=0; 

                for(let i=0;i<combinedNames.length;i++){
                    let char=combinedNames[i];
                    if(char=="t"||char=="r"||char=="u"||char=="e"){
                        truecount++;
                    }
                    if(char=="l"||char=="o"||char=="v"||char=="e"){
                        lovecount++;
                    }
                }
                let lovescore=truecount.toString()+lovecount.toString(); 
                let lovescorenum=parseInt(lovescore);

                if(lovescorenum>100){
                    lovescorenum=100;
                }
                
                if (lovescorenum >= 80) {
                    message = "❤ Perfect Match!";
                } else if (lovescorenum >= 60) {
                    message = "Great Match!";
                } else if (lovescorenum >= 40) {
                    message = "Good Friends!";
                } else {
                    message = "Better Luck Next Time!";
                }
                document.getElementById("result").innerHTML =`${name1} ❤ ${name2}<br>Love Score: <b>${lovescorenum}%</b><br>${message}`;
                
            }
            
        </script>
        <p class="p1">Just go and say it...!!!</p>

    </body>
</html>
